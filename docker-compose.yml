# AI 原生图书管理系统 — docker-compose（自托管部署）
# 用法：
#   1. cp .env.example .env  并按需修改
#   2. docker compose up -d
#   3. 访问 http://localhost:3000

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      JWT_SECRET: "${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}"
      # AI 供应商（留空则自动降级为本地关键词检索）
      AI_PROVIDER: "${AI_PROVIDER:-fake}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      AI_TIMEOUT_MS: "${AI_TIMEOUT_MS:-20000}"
      AI_MAX_OUTPUT_TOKENS: "${AI_MAX_OUTPUT_TOKENS:-1000}"
    restart: unless-stopped
    # 数据目前为内存驻留；持久化见 docs/deployment.md "备份策略"
